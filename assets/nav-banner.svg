<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 260" width="1200" height="260" role="img" aria-label="Navigation Mask and Pathfinding"><defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0b0f19" />
      <stop offset="0.5" stop-color="#7f1d1d" />
      <stop offset="0.85" stop-color="#dc2626" />
      <stop offset="1" stop-color="#f59e0b" />
    </linearGradient>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M20 0H0V20" fill="none" stroke="#ffffff" stroke-opacity="0.07" stroke-width="1" />
    </pattern>
  </defs>
  <rect width="1200" height="260" rx="14" fill="url(#bg)" />
  <rect width="1200" height="260" rx="14" fill="url(#grid)" />
  
  <g fill="#000000" fill-opacity="0.38">
    <rect x="200" y="200" width="100" height="40" />
    <rect x="800" y="200" width="100" height="40" />
    <rect x="60" y="40" width="40" height="20" />
    <rect x="1080" y="60" width="60" height="20" />
  </g>
  
  <path d="M60 230 L160 230 L180 190 L320 190 L340 230 L760 230 L780 190 L920 190 L940 230 L1140 230" fill="none" stroke="#fbbf24" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="9 7">
    <animate attributeName="stroke-dashoffset" from="64" to="0" dur="2s" repeatCount="indefinite" />
  </path>
  <circle cx="60" cy="230" r="7" fill="#fbbf24" />
  <circle cx="1140" cy="230" r="7" fill="#22c55e">
    <animate attributeName="r" values="7;10;7" dur="1.6s" repeatCount="indefinite" />
  </circle>
  
  <text x="600" y="108" text-anchor="middle" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="48" font-weight="800" fill="#ffffff" letter-spacing="1">Navigation Mask &amp; Pathfinding</text>
  <text x="600" y="150" text-anchor="middle" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="21" fill="#fde68a" letter-spacing="3">MAP PIXELS IN  •  OPTIMAL PATHS OUT</text>
</svg>