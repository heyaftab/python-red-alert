<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 260" width="1200" height="260" role="img" aria-label="Navigation Mask System Quick Start Guide" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f59e0b"/>
      <stop offset="0.15" stop-color="#dc2626"/>
      <stop offset="0.5" stop-color="#7f1d1d"/>
      <stop offset="1" stop-color="#0b0f19"/>
    </linearGradient>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M20 0H0V20" fill="none" stroke="#ffffff" stroke-opacity="0.07" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1200" height="260" rx="14" fill="url(#bg)"/>
  <rect width="1200" height="260" rx="14" fill="url(#grid)"/>
  <g fill="#000000" fill-opacity="0.38">
    <rect x="300" y="200" width="100" height="40"/>
    <rect x="900" y="200" width="100" height="40"/>
    <rect x="1080" y="40" width="40" height="20"/>
    <rect x="60" y="60" width="60" height="20"/>
  </g>
  <path d="M60 230 L260 230 L280 190 L420 190 L440 230 L860 230 L880 190 L1020 190 L1040 230 L1140 230"
        fill="none" stroke="#fbbf24" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="9 7">
    <animate attributeName="stroke-dashoffset" from="64" to="0" dur="2s" repeatCount="indefinite"/>
  </path>
  <circle cx="60" cy="230" r="7" fill="#fbbf24"/>
  <circle cx="1140" cy="230" r="7" fill="#22c55e">
    <animate attributeName="r" values="7;10;7" dur="1.6s" repeatCount="indefinite"/>
  </circle>
  <text x="600" y="100" text-anchor="middle" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="30" font-weight="600" fill="#fde68a" letter-spacing="6">NAVIGATION MASK SYSTEM</text>
  <text x="600" y="156" text-anchor="middle" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="56" font-weight="800" fill="#ffffff" letter-spacing="2">Quick Start Guide</text>
</svg>
