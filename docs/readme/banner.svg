<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" role="img" aria-label="Command and Conquer: Pygame Edition" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#120000"/>
      <stop offset="0.55" stop-color="#3b0000"/>
      <stop offset="1" stop-color="#7a1500"/>
    </linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.5" stop-color="#ffd2c4"/>
      <stop offset="1" stop-color="#ff5a36"/>
    </linearGradient>
    <radialGradient id="wedge" cx="0" cy="0" r="1">
      <stop offset="0" stop-color="#ff6a00" stop-opacity="0.65"/>
      <stop offset="1" stop-color="#ff6a00" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ff3b30" stroke-opacity="0.14" stroke-width="1"/>
      <animateTransform attributeName="patternTransform" type="translate" from="0 0" to="40 40" dur="5s" repeatCount="indefinite"/>
    </pattern>
    <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="1" fill="#000" fill-opacity="0.22"/>
    </pattern>
    <filter id="glow" x="-20%" y="-50%" width="140%" height="200%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="frame"><rect width="1200" height="300" rx="14"/></clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1200" height="300" fill="url(#bg)"/>
    <rect width="1200" height="300" fill="url(#grid)"/>

    <!-- radar -->
    <g transform="translate(1030 150)">
      <circle r="105" fill="#1a0000" fill-opacity="0.55" stroke="#ff3b30" stroke-opacity="0.7" stroke-width="2"/>
      <circle r="70" fill="none" stroke="#ff3b30" stroke-opacity="0.4"/>
      <circle r="35" fill="none" stroke="#ff3b30" stroke-opacity="0.4"/>
      <line x1="-105" y1="0" x2="105" y2="0" stroke="#ff3b30" stroke-opacity="0.35"/>
      <line x1="0" y1="-105" x2="0" y2="105" stroke="#ff3b30" stroke-opacity="0.35"/>
      <g>
        <path d="M0 0 L105 0 A105 105 0 0 0 74 -74 Z" fill="url(#wedge)"/>
        <line x1="0" y1="0" x2="105" y2="0" stroke="#ffb199" stroke-width="2"/>
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="4s" repeatCount="indefinite"/>
      </g>
      <circle cx="40" cy="-30" r="4" fill="#4aa3ff"><animate attributeName="opacity" values="0;1;0" dur="4s" begin="0.4s" repeatCount="indefinite"/></circle>
      <circle cx="-55" cy="25" r="4" fill="#4aa3ff"><animate attributeName="opacity" values="0;1;0" dur="4s" begin="2.2s" repeatCount="indefinite"/></circle>
      <circle cx="-20" cy="-60" r="4" fill="#4aa3ff"><animate attributeName="opacity" values="0;1;0" dur="4s" begin="3.1s" repeatCount="indefinite"/></circle>
      <circle r="5" fill="#ff3b30"/>
    </g>

    <!-- corner brackets -->
    <g stroke="#ff6a00" stroke-width="3" fill="none" stroke-linecap="round">
      <path d="M24 56 V24 H56"/>
      <path d="M1176 56 V24 H1144"/>
      <path d="M24 244 V276 H56"/>
      <path d="M1176 244 V276 H1144"/>
    </g>

    <!-- status line -->
    <text x="70" y="52" font-family="'Courier New', Courier, monospace" font-size="15" fill="#ff6a00" letter-spacing="3">
      <tspan>// SOVIET COMMAND UPLINK</tspan>
      <tspan fill="#ff3b30"> ● LIVE</tspan>
      <animate attributeName="opacity" values="1;1;0.35;1" keyTimes="0;0.7;0.85;1" dur="2s" repeatCount="indefinite"/>
    </text>

    <!-- title -->
    <g filter="url(#glow)">
      <text x="70" y="140" font-family="Impact, 'Arial Black', 'Helvetica Neue', Arial, sans-serif" font-size="78" font-weight="900" letter-spacing="4" fill="url(#title)">COMMAND &amp; CONQUER</text>
    </g>
    <text x="74" y="182" font-family="'Arial Black', 'Helvetica Neue', Arial, sans-serif" font-size="24" font-weight="700" letter-spacing="10" fill="#ff8a65">PYGAME EDITION  •  RED ALERT STYLE RTS</text>

    <rect x="70" y="198" width="640" height="3" fill="#ff3b30" fill-opacity="0.8">
      <animate attributeName="width" values="0;640;640" keyTimes="0;0.25;1" dur="6s" repeatCount="indefinite"/>
    </rect>

    <!-- rotating taglines -->
    <g font-family="'Courier New', Courier, monospace" font-size="26" font-weight="700" fill="#ffd2c4">
      <text x="70" y="244" opacity="0">&gt; Build your base.<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0;0.02;0.18;0.2;1" dur="15s" repeatCount="indefinite"/></text>
      <text x="70" y="244" opacity="0">&gt; Harvest the ore.<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.2;0.22;0.38;0.4;1" dur="15s" repeatCount="indefinite"/></text>
      <text x="70" y="244" opacity="0">&gt; Train your army.<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.4;0.42;0.58;0.6;1" dur="15s" repeatCount="indefinite"/></text>
      <text x="70" y="244" opacity="0">&gt; Crush the Allies.<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.6;0.62;0.78;0.8;1" dur="15s" repeatCount="indefinite"/></text>
      <text x="70" y="244" opacity="0">&gt; For the Motherland!<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.8;0.82;0.98;1;1" dur="15s" repeatCount="indefinite"/></text>
    </g>

    <rect width="1200" height="300" fill="url(#scan)"/>
  </g>
  <rect x="1" y="1" width="1198" height="298" rx="14" fill="none" stroke="#ff3b30" stroke-opacity="0.6" stroke-width="2"/>
</svg>
