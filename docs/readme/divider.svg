  <rect y="4" width="1200" height="4" rx="2" fill="url(#base)"/>
  <rect y="4" width="240" height="4" rx="2" fill="url(#shine)">
    <animate attributeName="x" values="-240;1200" dur="3s" repeatCount="indefinite"/>
