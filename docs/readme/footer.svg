<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 140" width="1200" height="140" role="img" aria-label="For the Motherland. Good luck, Commander." xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff6a00"/>
      <stop offset="0.5" stop-color="#d10000"/>
      <stop offset="1" stop-color="#7f0000"/>
    </linearGradient>
    <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse"><rect width="4" height="1" fill="#000" fill-opacity="0.2"/></pattern>
    <clipPath id="c"><rect width="1200" height="140" rx="14"/></clipPath>
  </defs>
  <g clip-path="url(#c)">
    <rect width="1200" height="140" fill="url(#bg)"/>
    <rect width="1200" height="140" fill="url(#scan)"/>
    <text x="600" y="62" text-anchor="middle" font-family="Impact, 'Arial Black', Arial, sans-serif" font-size="38" letter-spacing="6" fill="#fff">FOR THE MOTHERLAND</text>
    <text x="600" y="98" text-anchor="middle" font-family="'Courier New', Courier, monospace" font-size="20" letter-spacing="4" fill="#ffe3d6">Good luck, Commander. Star the repo if you enjoyed it.</text>
    <animate attributeName="opacity" values="1;0.88;1" dur="3s" repeatCount="indefinite"/>
  </g>
</svg>
